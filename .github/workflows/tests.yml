name: AI Governance Portfolio tests

on:
  push:
    branches: [main]
    paths:
      - "msi5004-ai-governance-portfolio/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "msi5004-ai-governance-portfolio/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 01-ai-act-risk-navigator
          - 02-fairness-auditor
          - 03-governance-documentation-suite
          - 04-explainability-auditor
    defaults:
      run:
        working-directory: msi5004-ai-governance-portfolio/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -v
