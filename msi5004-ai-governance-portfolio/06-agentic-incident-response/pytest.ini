[pytest]
; redteam_suite.py is deliberately not named test_*.py -- it's also meant to
; be run directly (`python3 redteam_suite.py`) for a human-readable red-team
; report, which pytest's default naming convention doesn't support well as
; a script name. This makes plain `pytest` (no explicit file args, as CI
; runs it) still discover it, so the adversarial suite isn't silently
; skipped in automated runs.
python_files = test_*.py redteam_suite.py
